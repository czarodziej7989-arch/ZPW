<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>

.slabe{
    color:red;
}
.srednie{
    color:orange;
}
.silne{
    color:green;
}
</style>
<script>
let liczba = 0;
$(function(){
    $("#szukaj").on("keydown",function(){
        if(event.key == "Enter"){
            if($("#szukaj").val().trim() != ""){ 
            $("#wynik").text("Szukam "+$("#szukaj").val());
        } else {
            $("#wynik").text("wypisz fraze");
            $("#wynik").css("color","red")
        }
        } else if(event.key == "Escape"){
           $("#szukaj").text("");
           $("#wynik").text("");
        
        }
    })
    $("#haslo").on("input",function(){
        if($("#haslo").val().length < 6){
            $("#sila").removeClass()
            $("#sila").addClass("slabe")
            $("#sila").text("Słabe haslko!")
        } else if($("#haslo").val().length >= 6 && $("#haslo").val().length <=9){
            $("#sila").removeClass()
            $("#sila").addClass("srednie")
            $("#sila").text("Srednie haslko!")
        } else if($("#haslo").val().length >= 10){
            $("#sila").removeClass()
            $("#sila").addClass("silne")
            $("#sila").text("silne haslko!")
        }
    })
    $("#logowanie").submit(function(e){
        e.preventDefault();
        if($("#login").val() == ""){
            $("#info").text("podaj login")
   
        }else if($("#pass").val().length < 6){
            $("#info").append("za male haslo")
        }
         else {
            
            $("#info").text("Witaj, "+$("#login").val())
            $("#info").css("color","green")
        }
    })
    $("#rozmiar").change(function(){
        $("#tekst").css("font-size",$("#rozmiar").val()+"px")
        $("#tekst").after("<p>Aktualny rozmiar:"+$("#rozmiar").val()+" X px </p>")
    }) 
    
    $(".dodatek").change(function(){
        let suma = 20;
        $(".dodatek:checked").each(function(){
            suma += Number($(this).val())
        })
        $("#suma").text("suma"+ suma)
    })
    $("#akcept").change(function(){
    if($(this).is(":checked")){
        $("#zamow").prop("disabled", false)
    } else {
        $("#zamow").prop("disabled", true)
    }
    })

});
</script>
<body>
<input type="text" id="szukaj" placeholder="Szukaj...">
<p id="wynik"></p>
<hr>
<input type="password" id="haslo">
<p id="sila"></p>
<hr>
<form id="logowanie">
  <input type="text" id="login" placeholder="Login">
  <input type="password" id="pass" placeholder="Hasło">
  <button type="submit">Zaloguj</button>
</form>
<p id="info"></p>
<hr>
<select id="rozmiar">
  <option value="14">Mały</option>
  <option value="20">Średni</option>
  <option value="28">Duży</option>
</select>
<p id="tekst">Przykładowy tekst akapitu.</p>
<hr>

<label><input type="checkbox" class="dodatek" value="3"> Ser (3 zł)</label>
<label><input type="checkbox" class="dodatek" value="5"> Szynka (5 zł)</label>
<label><input type="checkbox" class="dodatek" value="4"> Pieczarki (4 zł)</label>
<p>Cena: <span id="suma">20</span> zł</p>
<label><input type="checkbox" id="akcept"> Potwierdzam zamówienie</label>
<button id="zamow" disabled>Zamów</button>

Zadanie 6: Kalkulator BMI z walidacją

<input type="text" id="waga" placeholder="Waga (kg)">
<input type="text" id="wzrost" placeholder="Wzrost (cm)">
<button id="licz">Oblicz</button>
<p id="bmi"></p>

</body>
</html>
