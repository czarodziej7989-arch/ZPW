<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>
    .drogie{

        background-color: red;
    }

</style>
<script>
let liczba = 0;
$(function(){
$("li").each(function(index, element){
    liczba += $(this).data("cena")

    if($(this).data("cena") > 20 ){
        $(this).addClass("drogie")
    }
})
$("#suma").text(liczba)

$("li").each(function(index, element){
    if(index % 2 == 0){
        $(this).css("background-color","gray")
    }
})
$("li").each(function(index, element){
    if($(this).data("cena") > 20){
        $(this).css("background-color","green")
        return(false);
    }

})
});
</script>
<body>
 <ul id="lista">
    <li data-cena="10">Chleb</li>
    <li data-cena="25">Ser</li>
    <li data-cena="5">Woda</li>
    <li data-cena="40">Szynka</li>
</ul>
<p id="suma"></p>
</body>
</html>
