<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>

</style>
<script>
let liczba = 0;
$(function(){
    $("#kolor").change(function(){
        $("body").css("background-color",$(this).val())
    })
    $("#rozmiar").change(function(){
        $("#info").text("do zplatyt"+$(this).val())
    })
    $("#newsletter").change(function(){
        if($(this).is(":checked")){
            $("#stan").text("zapisano nas do newslettera.")
        } else {
            $("#stan").text("wypisano nas.")
        }
    })
    $("#akceptuje").change(function(){
        if($(this).is(":checked")){
            $("#zarejestruj").prop("disabled",false)
        } else {
            $("#zarejestruj").prop("disabled",true)
        }
    })
    $("#tekst").on("input",function(){
        $("#podglad").text($(this).val())
    })
    let liczba = 100;
$("#tekst2").on("input", function() {
    let sum = liczba - $(this).val().length;

    $("#licznik").text("Pozostało znaków: " + sum);

    if (sum <= 10) {
        $("#licznik").css("color", "red");
    } else {
        $("#licznik").css("color", "black");
    }
});
});
</script>
<body>
    <select id="kolor">
        <option value="white">White</option>
        <option value="yellow">yellow</option>
        <option value="lightblue">lightblue</option>
    </select>
    <hr>
        <select id="rozmiar">
        <option value="20">mala</option>
        <option value="30">srednia</option>
        <option value="40">duza</option>
    </select>
    <p id="info"></p>
    <hr>
    <input type="checkbox" id="newsletter">chce newsletter
    <p id="stan"></p>
    <hr>
    <input type="checkbox" id="akceptuje">Akceptuje regulamin
    <button id="zarejestruj" disabled >zarejestruj</button>
    <hr>
    <input type="text" id="tekst">
    <p>podglad: <span id="podglad"></span></p>
    <hr>
    <input type="textarea" id="tekst2" maxlength="100">
    <p id="licznik"></p>
</body>
</html>
