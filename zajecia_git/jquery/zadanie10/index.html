<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>


</style>
<script>
let liczba = 0;
$(function(){
    $(".card").css({
    "background-color": "rgb("+ Math.floor((Math.random() * 250)+1) + ", "+ Math.floor((Math.floor()*250)+1)+", "+ Math.floor((Math.floor()*250)+1)+ ")",
    "height": Math.floor((Math.random()*150)+100)+"px",
    "width": Math.floor((Math.random()*150)+100)+"px"
    })

    $("#dodaj").click(function(){
        liczba++;
        $("#licznik").text("licznik: "+liczba)
        $("#container").append('<div class="card style="background-color: rgb("+>'+Math.floor((Math.random()*100)+1)+'</div>')
    })

});
</script>
<body>
<button id="dodaj">Dodaj karte</button>
<button id="usun">Usun wszystkie</button>
<div id="container">
    <p id="licznik">Licznik</p>

</div>
</body>
</html>
